<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <title>천공탑 — 홀로 오르는 자</title>
  <link rel="stylesheet" href="css/style.css?v=37">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 상단 UI -->
  <div id="hud">
    <div id="player-hp"><span>HP</span><div class="track"><div class="fill"></div></div></div>
    <button id="btn-debug" type="button">DBG</button>
    <button id="btn-pause" type="button" aria-label="일시정지">Ⅱ</button>
  </div>

  <!-- 보스 이름과 체력 -->
  <div id="mob-count"></div>

  <div id="boss-bar">
    <div class="name"></div>
    <div class="track"><div class="fill"></div></div>
  </div>

  <!-- 터치 조작 버튼 -->
  <div id="controls">
    <!-- 조이스틱: 왼쪽 영역 아무 곳이나 누르면 그 자리에 나타남 -->
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div class="pad pad-right">
      <div class="btn small" data-act="dodge">회피</div>
      <div class="btn small" data-act="jump">점프</div>
      <div class="btn big" data-act="attack">공격</div>
      <div class="btn tiny" data-act="heal">회복<b id="potion-count">2</b></div>
    </div>
  </div>

  <!-- 시작 화면: 첫 터치로 전체화면 전환 -->
  <div id="start">
    <h1>천공탑</h1>
    <p class="sub">홀로 오르는 자</p>
    <p class="tap">화면을 터치해서 시작</p>
    <p class="ver">개발 버전 · v37</p>
  </div>

  <!-- 로비 (탑 입구) -->
  <div id="lobby" class="hidden">
    <div class="lb-bg"></div>
    <div class="lb-top">
      <div class="lb-title">천공탑<small>홀로 오르는 자</small></div>
      <button type="button" class="lb-icon" data-open="settings" aria-label="설정">⚙</button>
    </div>
    <div class="lb-left">
      <canvas id="lb-hero"></canvas>
    </div>
    <div class="lb-hero-info">
      <div id="lb-best"></div>
    </div>
    <div class="lb-climb">
      <div class="lb-floor">
        <button type="button" class="lb-arrow" data-floor="-1" aria-label="아래층">◀</button>
        <div class="lb-floor-info"><b id="lb-fn">1F</b><span id="lb-boss"></span></div>
        <button type="button" class="lb-arrow" data-floor="1" aria-label="위층">▶</button>
      </div>
      <button type="button" id="lb-go">탑 오르기</button>
      <div id="lb-note"></div>
    </div>
    <div class="lb-tabs">
      <button type="button" data-open="equip"><i>⚔</i>장비</button>
      <button type="button" data-open="skills"><i>✦</i>스킬</button>
      <button type="button" data-open="forge" class="locked"><i>⚒</i>강화</button>
      <button type="button" data-open="records"><i>☰</i>기록</button>
    </div>
    <div id="lb-panel" class="hidden">
      <div class="lb-panel-box">
        <div class="lb-panel-head"><b></b><button type="button" class="lb-close" aria-label="닫기">✕</button></div>
        <div class="lb-panel-body"></div>
      </div>
    </div>
  </div>

  <!-- 일시정지 -->
  <div id="pause" class="hidden">
    <div class="title">일시정지</div>
    <div class="btns"><button type="button" data-act="resume">계속하기</button><button type="button" class="ghost" data-act="lobby">로비로 나가기</button></div>
  </div>

  <!-- 승리 / 패배 -->
  <div id="result" class="hidden">
    <div class="title"></div>
    <div class="sub"></div>
    <div class="btns"><button type="button" class="b1"></button><button type="button" class="b2 ghost"></button></div>
  </div>

  <!-- 세로 화면 안내 -->
  <div id="rotate">
    <div class="phone"></div>
    <p>휴대폰을 가로로 돌려주세요</p>
  </div>

  <!-- 순서 중요: 위에 있는 파일을 아래 파일이 사용함 -->
  <!-- ?v= 숫자: 업데이트할 때마다 올리기 (config.js의 G.VERSION과 같은 숫자) -->
  <script src="js/config.js?v=37"></script>
  <script src="js/save.js?v=37"></script>
  <script src="js/input.js?v=37"></script>
  <script src="js/rig.js?v=37"></script>
  <script src="js/render.js?v=37"></script>
  <script src="js/stage.js?v=37"></script>
  <script src="js/effects.js?v=37"></script>
  <script src="js/combat.js?v=37"></script>
  <script src="js/player.js?v=37"></script>
  <script src="js/bosses.js?v=37"></script>
  <script src="js/bossfx.js?v=37"></script>
  <script src="js/boss.js?v=37"></script>
  <script src="js/floors.js?v=37"></script>
  <script src="js/mobsprite.js?v=37"></script>
  <script src="js/mobs.js?v=37"></script>
  <script src="js/intro.js?v=37"></script>
  <script src="js/floor.js?v=37"></script>
  <script src="js/hero3d.js?v=37"></script>
  <script src="js/descent.js?v=37"></script>
  <script src="js/lobby.js?v=37"></script>
  <script src="js/main.js?v=37"></script>
</body>
</html>
