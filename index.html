<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <title>천공탑 — 홀로 오르는 자</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 상단 UI -->
  <div id="hud">
    <div id="floor">1F</div>
    <button id="btn-debug" type="button">DBG</button>
  </div>

  <!-- 터치 조작 버튼 -->
  <div id="controls">
    <!-- 조이스틱: 왼쪽 영역 아무 곳이나 누르면 그 자리에 나타남 -->
    <div id="stick-zone">
      <div id="stick-base"><div id="stick-knob"></div></div>
    </div>
    <div class="pad pad-right">
      <div class="btn small" data-act="dodge">회피</div>
      <div class="btn small" data-act="jump">점프</div>
      <div class="btn big" data-act="attack">공격</div>
    </div>
  </div>

  <!-- 시작 화면: 첫 터치로 전체화면 전환 -->
  <div id="start">
    <h1>천공탑</h1>
    <p class="sub">홀로 오르는 자</p>
    <p class="tap">화면을 터치해서 시작</p>
    <p class="ver">개발 버전 1-2 · 발판, 공격, 회피</p>
  </div>

  <!-- 세로 화면 안내 -->
  <div id="rotate">
    <div class="phone"></div>
    <p>휴대폰을 가로로 돌려주세요</p>
  </div>

  <!-- 순서 중요: 위에 있는 파일을 아래 파일이 사용함 -->
  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/rig.js"></script>
  <script src="js/render.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/player.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
